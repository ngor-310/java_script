<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SpendWise Budget Tracker</h1>
        
        <!-- Interactive Prompt Trigger -->
        <div class="setup-section">
            <button id="start-btn">Start Budget Calculation (Prompts)</button>
        </div>

        <!-- Summary Section -->
        <div class="summary">
            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">$0.00</p>
            </div>
            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="balance">$0.00</p>
            </div>
        </div>

        <!-- Form Section -->
        <form id="transaction-form">
            <h2>Add Transaction</h2>
            <div class="form-control">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g. Salary, Groceries" required>
            </div>
            <div class="form-control">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="e.g. 100 or 50" required>
            </div>
            <div class="form-control">
                <label for="type">Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <button type="submit">Add Transaction</button>
        </form>

        <!-- Transaction History -->
        <h2>Transaction History</h2>
        <ul id="transaction-list" class="list"></ul>
    </div>

    <!-- Linked JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
